<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — FixTrack Pro</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1f1f1f;
      }

      .tarjeta {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 360px;
      }

      .logo {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 12px;
      }

      p {
        font-size: 15px;
        line-height: 1.5;
        color: #555;
        margin: 0 0 28px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: #0d6efd;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 32px;
        cursor: pointer;
      }

      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <img class="logo" src="assets/icon.png" alt="FixTrack Pro" />
      <h1>Sin conexión a internet</h1>
      <p>
        FixTrack Pro necesita conexión a internet para funcionar.
        Verifica tu conexión de datos o Wi-Fi e inténtalo de nuevo.
      </p>
      <button id="reintentar" type="button">Reintentar</button>
    </div>
    <script>
      // Vuelve a apuntar la vista web a la URL de producción; si sigue sin
      // haber red, el propio WebView redirige otra vez a esta pantalla.
      document.getElementById("reintentar").addEventListener("click", function () {
        window.location.href = "https://fixtrackpro.com";
      });
    </script>
  </body>
</html>
