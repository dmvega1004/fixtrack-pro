<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — FixTrack Pro</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1e293b;
      }

      .tarjeta {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 360px;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 12px;
      }

      p {
        font-size: 15px;
        line-height: 1.5;
        color: #64748b;
        margin: 0 0 20px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 32px;
        cursor: pointer;
      }

      button:active {
        opacity: 0.85;
      }

      .alternativas {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
        width: 100%;
      }

      .alternativas p {
        font-size: 12px;
        color: #94a3b8;
        margin: 0 0 10px;
      }

      .alternativas nav {
        display: flex;
        justify-content: center;
        gap: 16px;
      }

      .alternativas a {
        font-size: 14px;
        font-weight: 500;
        color: #2563eb;
        text-decoration: none;
      }

      .alternativas a:active {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <!--
      Pantalla de respaldo del SERVICE WORKER (sw.js), distinta de la de
      Capacitor (apps/mobile/www/offline.html). Esta la sirve el fetch
      handler cuando una navegación falla y esa página tampoco está en la
      caché — es decir, cuando nunca se abrió con conexión. Por eso el
      mensaje es distinto: no es "la app entera necesita internet", es
      "esta pantalla en particular no se guardó todavía".

      Completamente autónoma a propósito: el logo va incrustado como data
      URL (no como <img src="/brand/...">) porque esta página se sirve
      precisamente cuando no hay red, y una imagen externa sin precachear
      se vería como ícono roto. Sin hojas de estilo ni fuentes externas
      tampoco — todo el CSS está inline arriba.
    -->
