<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — FixTrack Pro</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background: #fafafa;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1e293b;
      }

      .tarjeta {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 360px;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 12px;
      }

      p {
        font-size: 15px;
        line-height: 1.5;
        color: #64748b;
        margin: 0 0 28px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 32px;
        cursor: pointer;
      }

      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <!--
      Pantalla de respaldo del SERVICE WORKER (sw.js), distinta de la de
      Capacitor (apps/mobile/www/offline.html). Esta la sirve el fetch
      handler cuando una navegación falla y esa página tampoco está en la
      caché — es decir, cuando nunca se abrió con conexión. Por eso el
      mensaje es distinto: no es "la app entera necesita internet", es
      "esta pantalla en particular no se guardó todavía".
    -->
    <div class="tarjeta">
      <img class="logo" src="/brand/icon-192.png" alt="FixTrack Pro" />
      <h1>Sin conexión</h1>
      <p>
        Esta pantalla no está guardada para verla sin conexión. Ábrela una vez
        con internet y quedará disponible la próxima vez que no tengas señal.
      </p>
      <button id="reintentar" type="button">Reintentar</button>
    </div>
    <script>
      document.getElementById("reintentar").addEventListener("click", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
